[tool.poetry]
name = "gcp-tracing"
version = "0.1.0"
description = "OpenTelemetry tracing utilities for GCP Cloud Trace integration with Flask applications"
authors = ["BC Registries and Online Services"]
readme = "README.md"
packages = [{include = "gcp_tracing", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
flask = ">=3"
opentelemetry-sdk = "^1.42.0"
opentelemetry-exporter-gcp-trace = "^1.12.0"
opentelemetry-instrumentation-flask = "^0.63b1"
opentelemetry-instrumentation-requests = "^0.63b1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-mock = "^3.14.0"
pytest-cov = "^5.0.0"

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[[tool.poetry.source]]
name = "sbc-connect"
url = "https://northamerica-northeast1-python.pkg.dev/c4hnrd-tools/python/"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
